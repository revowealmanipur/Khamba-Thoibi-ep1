<!DOCTYPE html><!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Khamba & Thoibi — Music</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: transparent;
        }


        /* =================================
           FLOATING MUSIC PLAYER
           ================================= */

        .music-player {

            position: fixed;

            right: 18px;
            bottom: 20px;

            width: 64px;
            height: 64px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #6b5237,
                    #493522 55%,
                    #2c2117
                );

            border: 1px solid #b89a70;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.4),
                inset 0 1px 2px rgba(255,255,255,0.16);

            z-index: 9999;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

        }


        /* =================================
           BUTTON
           ================================= */

        #musicBtn {

            width: 54px;
            height: 54px;

            border-radius: 50%;

            border: 1px solid #d1b58b;

            background:
                linear-gradient(
                    145deg,
                    #55402b,
                    #3b2b1d
                );

            color: #f4e5c5;

            font-size: 21px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;

        }


        /* =================================
           HOVER
           ================================= */

        #musicBtn:hover {

            transform: scale(1.08);

            background:
                linear-gradient(
                    145deg,
                    #654b31,
                    #473321
                );

            box-shadow:
                0 0 18px
                rgba(209,181,139,0.35);

        }


        /* =================================
           CLICK
           ================================= */

        #musicBtn:active {

            transform: scale(0.92);

        }


        /* =================================
           PLAYING GLOW
           ================================= */

        .music-player.playing {

            animation:
                musicGlow 2.4s infinite ease-in-out;

        }


        @keyframes musicGlow {

            0% {

                box-shadow:
                    0 6px 20px rgba(0,0,0,0.4),
                    0 0 0 rgba(209,181,139,0);

            }

            50% {

                box-shadow:
                    0 6px 22px rgba(0,0,0,0.42),
                    0 0 22px
                    rgba(209,181,139,0.38);

            }

            100% {

                box-shadow:
                    0 6px 20px rgba(0,0,0,0.4),
                    0 0 0 rgba(209,181,139,0);

            }

        }


        /* =================================
           MOBILE
           ================================= */

        @media (max-width: 600px) {

            .music-player {

                right: 14px;
                bottom: 15px;

                width: 59px;
                height: 59px;

            }


            #musicBtn {

                width: 49px;
                height: 49px;

                font-size: 19px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         ONE MUSIC
         ================================= -->

    <audio id="bgMusic" loop>

        <source
            src="music.mp3"
            type="audio/mpeg">

    </audio>


    <!-- =================================
         MUSIC BUTTON
         ================================= -->

    <div
        class="music-player"
        id="musicPlayer">

        <button
            id="musicBtn"
            aria-label="Play or pause music">

            ▶

        </button>

    </div>



    <script>

        const music =
            document.getElementById("bgMusic");

        const musicBtn =
            document.getElementById("musicBtn");

        const musicPlayer =
            document.getElementById("musicPlayer");


        /* =================================
           PLAY MUSIC
           ================================= */

        function playMusic() {

            music.play()
                .then(() => {

                    musicBtn.textContent = "⏸";

                    musicPlayer.classList.add(
                        "playing"
                    );

                })
                .catch(() => {});

        }


        /* =================================
           FIRST TAP ANYWHERE
           ================================= */

        document.addEventListener(
            "click",
            function () {

                playMusic();

            },
            {
                once: true
            }
        );


        document.addEventListener(
            "touchstart",
            function () {

                playMusic();

            },
            {
                once: true,
                passive: true
            }
        );


        /* =================================
           BUTTON CONTROL
           ================================= */

        musicBtn.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                if (music.paused) {

                    playMusic();

                }

                else {

                    music.pause();

                }

            }
        );


        /* =================================
           PLAY STATE
           ================================= */

        music.addEventListener(
            "play",
            function () {

                musicBtn.textContent = "⏸";

                musicPlayer.classList.add(
                    "playing"
                );

            }
        );


        /* =================================
           PAUSE STATE
           ================================= */

        music.addEventListener(
            "pause",
            function () {

                musicBtn.textContent = "▶";

                musicPlayer.classList.remove(
                    "playing"
                );

            }
        );

    </script>


</body>

</html>
