<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#musicBtn {
    position: fixed;
    right: 15px;
    bottom: 15px;

    width: 58px;
    height: 58px;

    border-radius: 50%;
    border: 1px solid #d8bd91;

    background: radial-gradient(
        circle at 35% 28%,
        #806548,
        #60482f 35%,
        #493522 68%,
        #302216
    );

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: grab;
    touch-action: none;
    user-select: none;

    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;

    outline: none;

    box-shadow:
        0 5px 12px rgba(48,34,22,.38),
        0 10px 24px rgba(48,34,22,.25);

    z-index: 999999;
}

#musicBtn::before {
    content: "";
    position: absolute;
    inset: 5px;

    border-radius: 50%;
    border: 1px solid rgba(244,229,197,.18);

    pointer-events: none;
}

#musicBtn:focus,
#musicBtn:active {
    outline: none;
}

.playIcon {
    width: 0;
    height: 0;

    margin-left: 4px;

    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 13px solid #f4e5c5;
}

.pauseIcon {
    display: flex;
    gap: 5px;
}

.pauseIcon span {
    width: 4px;
    height: 17px;

    background: #f4e5c5;
    border-radius: 1px;
}

#musicBtn.dragging {
    cursor: grabbing;
    transform: scale(1.08);
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" type="button">
    <span id="musicIcon" class="playIcon"></span>
</button>

<script>

const music = document.getElementById("bgMusic");
const button = document.getElementById("musicBtn");
const icon = document.getElementById("musicIcon");

let dragging = false;
let moved = false;

let startX = 0;
let startY = 0;

let startLeft = 0;
let startTop = 0;

const dragDistance = 6;


/* PLAY / PAUSE */

function toggleMusic() {

    if (music.paused) {

        music.play();

        icon.className = "pauseIcon";
        icon.innerHTML =
            "<span></span><span></span>";

    } else {

        music.pause();

        icon.className = "playIcon";
        icon.innerHTML = "";

    }
}


/* DRAG START */

button.addEventListener("pointerdown", function(e) {

    dragging = true;
    moved = false;

    startX = e.clientX;
    startY = e.clientY;

    const rect = button.getBoundingClientRect();

    startLeft = rect.left;
    startTop = rect.top;

    button.setPointerCapture(e.pointerId);

    button.classList.add("dragging");

});


/* DRAGGING */

button.addEventListener("pointermove", function(e) {

    if (!dragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (
        Math.abs(dx) > dragDistance ||
        Math.abs(dy) > dragDistance
    ) {
        moved = true;
    }

    if (!moved) return;

    let newLeft = startLeft + dx;
    let newTop = startTop + dy;

    const maxLeft =
        window.innerWidth - button.offsetWidth;

    const maxTop =
        window.innerHeight - button.offsetHeight;

    newLeft = Math.max(
        0,
        Math.min(newLeft, maxLeft)
    );

    newTop = Math.max(
        0,
        Math.min(newTop, maxTop)
    );

    button.style.left = newLeft + "px";
    button.style.top = newTop + "px";

    button.style.right = "auto";
    button.style.bottom = "auto";

});


/* RELEASE */

button.addEventListener("pointerup", function() {

    if (!dragging) return;

    dragging = false;

    button.classList.remove("dragging");

    if (!moved) {
        toggleMusic();
    }

});


button.addEventListener("pointercancel", function() {

    dragging = false;
    moved = false;

    button.classList.remove("dragging");

});

</script>

</body>
</html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
