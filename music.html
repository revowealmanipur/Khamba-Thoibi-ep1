<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Playlist</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#musicBtn {
    position: fixed;
    right: 15px;
    bottom: 15px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid #d8bd91;
    background: radial-gradient(
        circle at 35% 28%,
        #806548,
        #60482f 35%,
        #493522 68%,
        #302216
    );
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    box-shadow:
        0 5px 12px rgba(48,34,22,.38),
        0 10px 24px rgba(48,34,22,.25);
    z-index: 999999;
}

#musicBtn::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 1px solid rgba(244,229,197,.18);
    pointer-events: none;
}

.playIcon {
    width: 0;
    height: 0;
    margin-left: 4px;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 13px solid #f4e5c5;
}

.pauseIcon {
    display: flex;
    gap: 5px;
}

.pauseIcon span {
    width: 4px;
    height: 17px;
    background: #f4e5c5;
    border-radius: 1px;
}
</style>
</head>
<body>

<audio id="bgMusic"></audio>

<button id="musicBtn" type="button">
    <span id="musicIcon" class="playIcon"></span>
</button>

<script>
const music = document.getElementById("bgMusic");
const button = document.getElementById("musicBtn");
const icon = document.getElementById("musicIcon");

const playlist = ["music1.mp3", "music.mp3"];
let currentTrackIndex = Math.floor(Math.random() * playlist.length);

// Load the initial random track
music.src = playlist[currentTrackIndex];

function toggleMusic() {
    if (music.paused) {
        music.play().catch(e => console.log("Playback blocked:", e));
        icon.className = "pauseIcon";
        icon.innerHTML = "<span></span><span></span>";
    } else {
        music.pause();
        icon.className = "playIcon";
        icon.innerHTML = "";
    }
}

// When a song ends, pick a different track index guaranteed if there are 2 songs
music.addEventListener("ended", () => {
    if (playlist.length > 1) {
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * playlist.length);
        } while (newIndex === currentTrackIndex);
        currentTrackIndex = newIndex;
    }
    
    music.src = playlist[currentTrackIndex];
    music.play().catch(e => console.log("Autoplay blocked:", e));
});

button.addEventListener("click", toggleMusic);
</script>

</body>
</html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>

<body>
  
</body>

</html>
