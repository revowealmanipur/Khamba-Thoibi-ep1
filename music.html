<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Playlist</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#musicBtn {
    position: fixed;
    right: 15px;
    bottom: 15px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid #d8bd91;
    background: radial-gradient(
        circle at 35% 28%,
        #806548,
        #60482f 35%,
        #493522 68%,
        #302216
    );
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    box-shadow:
        0 5px 12px rgba(48,34,22,.38),
        0 10px 24px rgba(48,34,22,.25);
    z-index: 999999;
}

#musicBtn::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 1px solid rgba(244,229,197,.18);
    pointer-events: none;
}

.playIcon {
    width: 0;
    height: 0;
    margin-left: 4px;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 13px solid #f4e5c5;
}

.pauseIcon {
    display: flex;
    gap: 5px;
}

.pauseIcon span {
    width: 4px;
    height: 17px;
    background: #f4e5c5;
    border-radius: 1px;
}
</style>
</head>
<body>

<audio id="bgMusic"></audio>

<button id="musicBtn" type="button">
    <span id="musicIcon" class="playIcon"></span>
</button>

<script>
const music = document.getElementById("bgMusic");
const button = document.getElementById("musicBtn");
const icon = document.getElementById("musicIcon");

// ** CHANGE YOUR SONG NAMES AND ARTISTS HERE **
const playlist = [
    { file: "music1.mp3", title: "Laiharaoba Melodies", artist: "Artist Name: Damcha" },
    { file: "music.mp3", title: "Folk vibes", artist: "Artist Name: Damcha" }
];

let shuffledQueue = [];
let currentTrack = null;
let previousTrack = null;

function generateShuffledQueue() {
    let array = [...playlist];
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function loadNextTrack() {
    if (currentTrack) {
        previousTrack = currentTrack;
    }
    if (shuffledQueue.length === 0) {
        shuffledQueue = generateShuffledQueue();
    }
    currentTrack = shuffledQueue.shift();
    music.src = currentTrack.file;
    updateMediaSession();
}

function loadPrevTrack() {
    if (previousTrack) {
        let temp = currentTrack;
        currentTrack = previousTrack;
        previousTrack = temp;
        music.src = currentTrack.file;
        updateMediaSession();
    }
}

// Initialize first track
loadNextTrack();

function updateMediaSession() {
    if ('mediaSession' in navigator && currentTrack) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: currentTrack.title,
            artist: currentTrack.artist,
            album: "My Playlist"
        });

        navigator.mediaSession.setActionHandler('play', () => {
            music.play().catch(e => console.log(e));
            icon.className = "pauseIcon";
            icon.innerHTML = "<span></span><span></span>";
        });

        navigator.mediaSession.setActionHandler('pause', () => {
            music.pause();
            icon.className = "playIcon";
            icon.innerHTML = "";
        });

        navigator.mediaSession.setActionHandler('previoustrack', () => {
            loadPrevTrack();
            music.play().catch(e => console.log(e));
            icon.className = "pauseIcon";
            icon.innerHTML = "<span></span><span></span>";
        });

        navigator.mediaSession.setActionHandler('nexttrack', () => {
            loadNextTrack();
            music.play().catch(e => console.log(e));
            icon.className = "pauseIcon";
            icon.innerHTML = "<span></span><span></span>";
        });
    }
}

function toggleMusic() {
    if (music.paused) {
        music.play().catch(e => console.log("Playback blocked:", e));
        icon.className = "pauseIcon";
        icon.innerHTML = "<span></span><span></span>";
        updateMediaSession();
    } else {
        music.pause();
        icon.className = "playIcon";
        icon.innerHTML = "";
    }
}

music.addEventListener("ended", () => {
    loadNextTrack();
    music.play().catch(e => console.log("Autoplay blocked:", e));
});

button.addEventListener("click", toggleMusic);
</script>

</body>
</html>
