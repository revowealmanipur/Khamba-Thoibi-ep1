<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Music</title>

<style>

/* =================================
   TRANSPARENT PAGE
   ================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: transparent;

    overflow: hidden;

}


/* =================================
   MUSIC BUTTON
   ================================= */

#musicBtn {

    position: fixed;

    right: 22px;
    bottom: 22px;

    left: auto;
    top: auto;

    width: 58px;
    height: 58px;

    padding: 0;

    border-radius: 50%;

    border: 1px solid #d8bd91;

    background:
        radial-gradient(
            circle at 35% 28%,
            #806548 0%,
            #60482f 35%,
            #493522 68%,
            #302216 100%
        );

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: grab;

    z-index: 99999;

    box-shadow:

        0 5px 12px
        rgba(48, 34, 22, 0.38),

        0 10px 24px
        rgba(48, 34, 22, 0.25),

        inset 0 1px 2px
        rgba(255, 239, 207, 0.18);

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    -webkit-tap-highlight-color:
        transparent;

    transition:

        transform 0.25s ease,

        box-shadow 0.25s ease;

}


/* =================================
   INNER RING
   ================================= */

#musicBtn::before {

    content: "";

    position: absolute;

    inset: 5px;

    border-radius: 50%;

    border:
        1px solid
        rgba(244, 229, 197, 0.18);

    pointer-events: none;

}


/* =================================
   ICON CONTAINER
   ================================= */

.icon {

    position: relative;

    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;

}


/* =================================
   PLAY ICON
   ================================= */

.play-icon {

    width: 0;
    height: 0;

    margin-left: 4px;

    border-top:
        8px solid transparent;

    border-bottom:
        8px solid transparent;

    border-left:
        12px solid #f4e5c5;

}


/* =================================
   PAUSE ICON
   ================================= */

.pause-icon {

    display: flex;

    gap: 5px;

}


.pause-icon span {

    display: block;

    width: 4px;
    height: 16px;

    border-radius: 1px;

    background: #f4e5c5;

}


/* =================================
   HOVER
   ================================= */

#musicBtn:hover {

    transform: scale(1.08);

    box-shadow:

        0 7px 15px
        rgba(48, 34, 22, 0.42),

        0 12px 28px
        rgba(48, 34, 22, 0.30),

        0 0 14px
        rgba(216, 189, 145, 0.15);

}


/* =================================
   DRAGGING
   ================================= */

#musicBtn.dragging {

    cursor: grabbing;

    transform: scale(1.12);

    box-shadow:

        0 12px 30px
        rgba(48, 34, 22, 0.50),

        0 0 20px
        rgba(216, 189, 145, 0.25);

}


/* =================================
   PLAYING GLOW
   ================================= */

#musicBtn.playing {

    animation:
        gentleGlow 2.8s ease-in-out infinite;

}


@keyframes gentleGlow {

    0% {

        box-shadow:

            0 5px 12px
            rgba(48, 34, 22, 0.38),

            0 10px 24px
            rgba(48, 34, 22, 0.25);

    }

    50% {

        box-shadow:

            0 6px 15px
            rgba(48, 34, 22, 0.42),

            0 10px 26px
            rgba(48, 34, 22, 0.30),

            0 0 16px
            rgba(216, 189, 145, 0.28);

    }

    100% {

        box-shadow:

            0 5px 12px
            rgba(48, 34, 22, 0.38),

            0 10px 24px
            rgba(48, 34, 22, 0.25);

    }

}


/* =================================
   MOBILE
   ================================= */

@media (max-width: 600px) {

    #musicBtn {

        width: 56px;
        height: 56px;

        right: 18px;
        bottom: 18px;

    }

}

</style>

</head>


<body>


<!-- =================================
     MUSIC
     ================================= -->

<audio id="bgMusic" loop>

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>


<!-- =================================
     ONLY BUTTON
     ================================= -->

<button
    id="musicBtn"
    type="button"
    aria-label="Music">

    <span class="icon">

        <span
            class="play-icon"
            id="playIcon">
        </span>

    </span>

</button>


<script>

/* =================================
   ELEMENTS
   ================================= */

const music =
    document.getElementById("bgMusic");

const button =
    document.getElementById("musicBtn");

const icon =
    document.getElementById("playIcon");


/* =================================
   DRAG VARIABLES
   ================================= */

let dragging = false;

let moved = false;

let startX = 0;
let startY = 0;

let startLeft = 0;
let startTop = 0;

const dragThreshold = 6;


/* =================================
   PLAY ICON
   ================================= */

function showPlayIcon() {

    icon.className =
        "play-icon";

}


/* =================================
   PAUSE ICON
   ================================= */

function showPauseIcon() {

    icon.className =
        "pause-icon";

    icon.innerHTML =
        "<span></span><span></span>";

}


/* =================================
   POINTER DOWN
   ================================= */

button.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;

        moved = false;

        startX = event.clientX;

        startY = event.clientY;


        const rect =
            button.getBoundingClientRect();


        startLeft = rect.left;

        startTop = rect.top;


        button.classList.add(
            "dragging"
        );


        button.setPointerCapture(
            event.pointerId
        );

    }
);


/* =================================
   POINTER MOVE
   ================================= */

button.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) return;


        const dx =
            event.clientX - startX;

        const dy =
            event.clientY - startY;


        if (

            Math.abs(dx) >
                dragThreshold ||

            Math.abs(dy) >
                dragThreshold

        ) {

            moved = true;

        }


        if (!moved) return;


        let newLeft =
            startLeft + dx;

        let newTop =
            startTop + dy;


        const maxLeft =
            window.innerWidth -
            button.offsetWidth;

        const maxTop =
            window.innerHeight -
            button.offsetHeight;


        newLeft =
            Math.max(
                0,
                Math.min(
                    newLeft,
                    maxLeft
                )
            );


        newTop =
            Math.max(
                0,
                Math.min(
                    newTop,
                    maxTop
                )
            );


        button.style.left =
            newLeft + "px";

        button.style.top =
            newTop + "px";

        button.style.right =
            "auto";

        button.style.bottom =
            "auto";

    }
);


/* =================================
   POINTER UP
   ================================= */

button.addEventListener(
    "pointerup",
    function() {

        if (!dragging) return;


        dragging = false;

        button.classList.remove(
            "dragging"
        );


        if (!moved) {

            toggleMusic();

        }

    }
);


/* =================================
   POINTER CANCEL
   ================================= */

button.addEventListener(
    "pointercancel",
    function() {

        dragging = false;

        moved = false;

        button.classList.remove(
            "dragging"
        );

    }
);


/* =================================
   PLAY / PAUSE
   ================================= */

function toggleMusic() {

    if (music.paused) {

        music.play();

    } else {

        music.pause();

    }

}


/* =================================
   MUSIC STARTED
   ================================= */

music.addEventListener(
    "play",
    function() {

        showPauseIcon();

        button.classList.add(
            "playing"
        );

    }
);


/* =================================
   MUSIC PAUSED
   ================================= */

music.addEventListener(
    "pause",
    function() {

        showPlayIcon();

        button.classList.remove(
            "playing"
        );

    }
);


/* =================================
   KEEP INSIDE SCREEN
   ================================= */

window.addEventListener(
    "resize",
    function() {

        const rect =
            button.getBoundingClientRect();


        const maxLeft =
            window.innerWidth -
            button.offsetWidth;

        const maxTop =
            window.innerHeight -
            button.offsetHeight;


        const left =
            Math.max(
                0,
                Math.min(
                    rect.left,
                    maxLeft
                )
            );


        const top =
            Math.max(
                0,
                Math.min(
                    rect.top,
                    maxTop
                )
            );


        button.style.left =
            left + "px";

        button.style.top =
            top + "px";

        button.style.right =
            "auto";

        button.style.bottom =
            "auto";

    }
);

</script>

</body>
</html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>
